# DINO at 1/4 degree on the NEMO-faithful card with GEOMETRIC EKE closure.
#
# Same card as nemo_faithful_kamm_mlf.yaml (read its header) on NEMO's DINO
# mesh at 1/4 degree: 202 x 797 x 36, built from NEMO's 1 degree namelist with
# only rn_e1_deg = 0.25 (nemo_dino_mesh.NEMO_DINO_R4). The basin walls move to
# U-faces [0, 50.25]. Initial state and forcing are NEMO's own on this mesh.
#
# Resolution-dependent settings for 1/4 degree:
#   dt = 720 s (12 min, NEMO DINO namelist_cfg 1/4 deg value)
#   n_barotropic_substeps = 25 (NEMO ln_bt_auto at dt=720 s, cmax=0.8)
#   gm_kappa_scheme = geometric (prognostic 2-D GEOMETRIC EKE closure,
#     alpha = 0.04, Torres et al. 2025 defaults)
#   Lateral harmonic viscosity (U_M = 0.27 m/s) and iso-neutral Redi diffusion
#   (U_T = 0.027 m/s) scale automatically with the 1/4 degree grid spacing.
#
#   JAX_PLATFORMS=cuda JAX_ENABLE_X64=1 python scripts/run/run_dino.py \
#       --config scripts/experiment/dino/nemo_faithful_kamm_mlf_r4.yaml \
#       --days <n>
recipe: nemo_dino_kamm_mlf
nemo_faithful_grid: true
nemo_resolution: R4
grid: latlon
dt: 720.0
n_barotropic_substeps: 25
gm_kappa_scheme: geometric
geometric_alpha: 0.04
snapshot_every_days: 30
output_dir: results/dino_nemo_faithful_kamm_mlf_r4
